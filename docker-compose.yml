name: w2health

# Fundação SaaS V1 — dois papéis de banco:
#   * DATABASE_ADMIN_URL → dono do schema (w2health): migrations, seed, CLI administrativa;
#   * DATABASE_URL       → papel de runtime da API (w2health_app): sem superusuário, sujeito
#                          a Row-Level Security. Criado/garantido pela migration de RLS.
# Segredos (JWT_SECRET_KEY, DATA_ENCRYPTION_KEY, APP_DB_PASSWORD) vêm do `.env` da raiz —
# nunca do repositório. Ver README § Segredos e .env.example.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-w2health}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-w2health}
      POSTGRES_DB: ${POSTGRES_DB:-w2health}
    ports:
      # 15432 no host: esta máquina já tem PostgreSQL nativo em 5432 e 5433.
      # Publicado só em 127.0.0.1 — o banco não fica exposto na rede.
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-w2health} -d ${POSTGRES_DB:-w2health}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PROJECT_NAME: "W2Health Intelligence"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      SERVICE_NAME: "api"
      # DEV: migrations no start da API. Produção: job `migrate` separado (ver
      # docker-compose.production.example.yml) — a API não tem privilégio de DDL.
      RUN_MIGRATIONS: "true"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
      API_V1_PREFIX: "/api"
      # Coleção -> o pydantic-settings decodifica como JSON. Manter array JSON válido.
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
      DATABASE_URL: "postgresql+psycopg://${APP_DB_ROLE:-w2health_app}:${APP_DB_PASSWORD:-w2health_app_dev}@postgres:5432/${POSTGRES_DB:-w2health}"
      DATABASE_ADMIN_URL: "postgresql+psycopg://${POSTGRES_USER:-w2health}:${POSTGRES_PASSWORD:-w2health}@postgres:5432/${POSTGRES_DB:-w2health}"
      # Fase 2 — papel de PIPELINE (escrita no data plane do tenant, sob RLS)
      DATABASE_PIPELINE_URL: "postgresql+psycopg://${PIPELINE_DB_ROLE:-w2health_pipeline}:${PIPELINE_DB_PASSWORD:-w2health_pipeline_dev}@postgres:5432/${POSTGRES_DB:-w2health}"
      PIPELINE_DB_ROLE: "${PIPELINE_DB_ROLE:-w2health_pipeline}"
      PIPELINE_DB_PASSWORD: "${PIPELINE_DB_PASSWORD:-w2health_pipeline_dev}"
      RAW_STORAGE_BACKEND: "local"
      RAW_STORAGE_ROOT: "/var/lib/w2health/raw"
      DATA_PLATFORM_DIR: "/data_platform"
      RATE_LIMIT_BACKEND: "${RATE_LIMIT_BACKEND:-database}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      APP_DB_ROLE: "${APP_DB_ROLE:-w2health_app}"
      # default só para desenvolvimento local; defina APP_DB_PASSWORD no .env
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:-w2health_app_dev}"
      # vazios em dev → chave JWT efêmera (sessões caem a cada restart) e MFA indisponível.
      # Em produção/staging a API não sobe sem eles.
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-}"
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      SUPER_ADMIN_REQUIRE_MFA: "${SUPER_ADMIN_REQUIRE_MFA:-true}"
      DEMO_USER_PASSWORD: "${DEMO_USER_PASSWORD:-}"
    ports:
      # 8010 no host: o Docker Desktop / wslrelay ocupam a 8000 nesta máquina.
      - "${BACKEND_PORT:-8010}:8000"
    volumes:
      # RAW storage local (DEV). Em produção: object storage (S3/ADLS/GCS/MinIO) via adapter.
      - rawdata:/var/lib/w2health/raw
    depends_on:
      postgres:
        condition: service_healthy

  # Worker do pipeline (Fase 3): mesma imagem da API, outro processo. Consome a fila
  # (pipeline_jobs) com o papel w2health_pipeline e lê o RAW do mesmo volume.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      SERVICE_NAME: "worker"
      DATABASE_URL: "postgresql+psycopg://${APP_DB_ROLE:-w2health_app}:${APP_DB_PASSWORD:-w2health_app_dev}@postgres:5432/${POSTGRES_DB:-w2health}"
      DATABASE_PIPELINE_URL: "postgresql+psycopg://${PIPELINE_DB_ROLE:-w2health_pipeline}:${PIPELINE_DB_PASSWORD:-w2health_pipeline_dev}@postgres:5432/${POSTGRES_DB:-w2health}"
      RAW_STORAGE_BACKEND: "local"
      RAW_STORAGE_ROOT: "/var/lib/w2health/raw"
      DATA_PLATFORM_DIR: "/data_platform"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:-}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-}"
    volumes:
      - rawdata:/var/lib/w2health/raw
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "healthcheck"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

  # Testes do backend em contêiner (alvo `test` da imagem): `docker compose --profile test run --rm backend-test`
  backend-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-w2health}:${POSTGRES_PASSWORD:-w2health}@postgres:5432/${POSTGRES_DB:-w2health}"
      DATABASE_ADMIN_URL: "postgresql+psycopg://${POSTGRES_USER:-w2health}:${POSTGRES_PASSWORD:-w2health}@postgres:5432/${POSTGRES_DB:-w2health}"
      DATA_PLATFORM_DIR: "/data_platform"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:${BACKEND_PORT:-8010}/api"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 (não "localhost": dentro do contêiner resolve para ::1/IPv6 e o
      # servidor do Next escuta só em IPv4).
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  pgdata:
  rawdata:
