# Blueprint do Render — sobe banco + backend + frontend de uma vez.
# Uso: no dashboard do Render, "New" -> "Blueprint" -> conectar este repositório.
#
# Nomes dos serviços definem a URL pública (https://<name>.onrender.com). Se você
# renomear w2health-backend/w2health-frontend, ajuste também CORS_ORIGINS e
# NEXT_PUBLIC_API_BASE_URL abaixo para os novos nomes.

databases:
  - name: w2health-db
    plan: free
    databaseName: w2health
    user: w2health

services:
  - type: web
    name: w2health-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: PROJECT_NAME
        value: "W2Health Intelligence"
      - key: ENVIRONMENT
        value: "render"
      - key: DATABASE_URL
        fromDatabase:
          name: w2health-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://w2health-frontend.onrender.com"]'
      # Free tier não tem Shell: o backend popula a massa sintética sozinho no
      # primeiro start (idempotente — não roda de novo em reinícios seguintes).
      - key: AUTO_SEED
        value: "true"
      - key: AUTO_SEED_BENEFICIARIOS
        value: "5000"

  - type: web
    name: w2health-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # NEXT_PUBLIC_* é inlinado no bundle em build time — o Render repassa
      # envVars de serviços Docker como build-args automaticamente.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: "https://w2health-backend.onrender.com/api"
