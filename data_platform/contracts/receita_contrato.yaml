entity: receita_contrato
version: 0            # LAYOUT PREPARADO — NÃO consumido pelo motor na v1.2
status: draft
grain: "1 linha por competência × contrato — contraprestação no grão do contrato"
primary_key: [tenant_id, competencia, id_contrato]
business_keys:
  - [tenant_id, competencia, id_contrato]
load_strategy: UPSERT
watermark_column: competencia
updated_at_column: source_updated_at
deduplication_strategy: "business_key"
fields:
  - name: tenant_id
    type: string
    nullable: false
    required_for: [contract_sinistralidade, reajuste]
    classification: internal
    description: "Cliente."
    example: "operadora-alfa"
    typical_source: "constante"
    transformation: "literal"
    quality_rules: [tenant_id_ausente]
  - name: competencia
    type: date
    nullable: false
    required_for: [contract_sinistralidade]
    classification: internal
    description: "Mês (1º dia)."
    example: "2026-07-01"
    typical_source: "faturamento"
    transformation: "date_trunc('month', ...)"
    quality_rules: [competencia_invalida]
  - name: id_contrato
    type: bigint
    nullable: false
    required_for: [contract_sinistralidade]
    classification: internal
    description: "FK contrato."
    example: 45
    typical_source: "faturamento por contrato"
    transformation: "lookup"
    quality_rules: []
  - name: quantidade_beneficiarios
    type: int
    nullable: false
    required_for: [contract_sinistralidade]
    classification: operational
    description: "Vidas do contrato no mês."
    example: 312
    typical_source: "faturamento / cadastro"
    transformation: "-"
    quality_rules: [valor_negativo]
  - name: receita_contraprestacao
    type: numeric
    nullable: false
    required_for: [contract_sinistralidade]
    classification: operational
    description: "Contraprestação do contrato no mês. Fonte: contraprestação faturada do contrato OU soma das mensalidades individuais OU rateio (marcar `metodologia`)."
    example: 198000.00
    typical_source: "faturamento por contrato"
    transformation: "ver docs/DISCOVERY_GESTAO_SAUDE.md § 6"
    quality_rules: [valor_negativo]
  - name: reajuste_aplicado_no_periodo
    type: numeric
    nullable: true
    required_for: [reajuste]
    classification: operational
    description: "Fração de reajuste aplicada na data-base que cai neste período (histórico)."
    example: 0.1150
    typical_source: "área de contratos"
    transformation: "-"
    quality_rules: []
  - name: metodologia
    type: string
    nullable: true
    required_for: []
    classification: internal
    description: "faturado_contrato | soma_mensalidades | rateio_vidas | rateio_faixa. OBRIGATÓRIO quando não for receita faturada real."
    example: "faturado_contrato"
    typical_source: "onboarding"
    transformation: "-"
    quality_rules: []
metadata_fields: [tenant_id, source_system, source_entity, source_record_id, ingestion_id,
                  ingestion_timestamp, source_updated_at, reference_date, raw_payload_hash]
notes: >
  **v1.2 não popula nem lê esta entidade.** Existe para que os conectores futuros já
  tenham um alvo canônico e para o discovery de receita granular / reajuste. A tabela
  `receitas_contrato` no Postgres é o espelho ORM (vazia).
